name: RTL verification
on: [push, pull_request, workflow_dispatch]
jobs:
  regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - run: make all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            reports/
            build/*.log
